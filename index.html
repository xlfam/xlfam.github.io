<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>XLFAM</title>
<link rel="icon" href="https://olist.xlfam.top/d/icons/favicon.svg" type="image/x-icon">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{
  --primary:#3b82f6;
  --primary-soft:#eff6ff;
  --bg:#f8fafc;
  --panel:#ffffff;
  --text:#334155;
  --text2:#64748b;
  --border:#e2e8f0;
  --hover:#f1f5f9;
  --danger:#ef4444;
  --shadow:0 4px 16px -2px rgba(15,23,42,.12);
  --card-w:150px;
  --card-h:48px;
  --gap:10px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;top:0;left:0;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;
  /* 整体居中 */
  display:flex;justify-content:center;
}
a{text-decoration:none;color:inherit;}
input,button{font-family:inherit;}

/* ---------- 主容器（居中 + 限宽） ---------- */
.main-container{
  width:100%;max-width:1440px;
  display:flex;flex-direction:column;height:100%;
  overflow:hidden;position:relative;min-width:0;
  background:var(--bg);
}

/* ---------- 顶栏 ---------- */
.header{
  position:relative;background:var(--bg);padding:0 16px;height:60px;
  display:flex;align-items:center;border-bottom:1px solid var(--border);
  z-index:99;flex-shrink:0;
}
.header-content{display:flex;align-items:center;width:100%;gap:12px;}

/* ---------- 搜索 ---------- */
.search-container{display:flex;align-items:center;flex:1;min-width:0;position:relative;max-width:720px;margin:0 auto;}
.engine-switch{
  display:flex;align-items:center;justify-content:center;width:38px;height:38px;
  background:var(--bg);border:1px solid var(--border);border-right:none;
  border-radius:8px 0 0 8px;cursor:pointer;color:var(--text2);font-size:15px;flex-shrink:0;
  transition:background-color .15s;
}
.engine-switch:hover{background:#e8eef7;color:var(--primary);}
.search-input{
  flex:1;height:38px;padding:0 12px;border:1px solid var(--border);
  border-radius:0 8px 8px 0;background:var(--bg);font-size:14px;outline:none;min-width:0;
  color:var(--text);transition:border-color .15s,box-shadow .15s;
}
.search-input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.12);background:#fff;}
.search-hint{
  position:absolute;right:12px;font-size:11px;color:#cbd5e1;
  pointer-events:none;white-space:nowrap;display:none;
}

/* ---------- 工具栏 ---------- */
.toolbar-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.icon-btn{
  width:36px;height:36px;border-radius:8px;border:1px solid var(--border);
  background:var(--panel);cursor:pointer;display:flex;align-items:center;
  justify-content:center;color:var(--text2);font-size:15px;transition:.15s;
}
.icon-btn:hover{background:var(--hover);color:var(--primary);}
.icon-btn.active{background:var(--primary-soft);color:var(--primary);border-color:var(--primary);}

/* ---------- 设置面板 ---------- */
.settings-panel{
  position:absolute;top:56px;right:16px;width:320px;max-height:calc(100vh - 80px);
  overflow-y:auto;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);
  border:1px solid var(--border);padding:16px;display:none;z-index:1000;
  flex-direction:column;gap:14px;
}
.settings-panel.open{display:flex;}
.panel-title{font-size:13px;font-weight:600;color:var(--text);display:flex;align-items:center;gap:7px;}
.panel-title i{color:var(--primary);}
.panel-divider{height:1px;background:var(--border);margin:2px 0;}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.setting-label{font-size:13.5px;display:flex;align-items:center;gap:8px;color:var(--text);}
.setting-label i{color:var(--text2);width:16px;text-align:center;}
.switch{position:relative;width:44px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{
  position:absolute;inset:0;cursor:pointer;background:#cbd5e1;
  border-radius:24px;transition:.3s;
}
.slider:before{
  position:absolute;content:"";height:18px;width:18px;left:3px;bottom:3px;
  background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.2);
}
.switch input:checked + .slider{background:var(--primary);}
.switch input:checked + .slider:before{transform:translateX(20px);}

.mode-switch{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0;}
.mode-switch button{
  border:none;background:var(--panel);padding:6px 12px;font-size:12.5px;
  color:var(--text2);cursor:pointer;transition:.15s;
}
.mode-switch button.active{background:var(--primary);color:#fff;}

.form-group{display:flex;flex-direction:column;gap:5px;}
.form-group label{font-size:12px;color:var(--text2);}
.form-group input, .form-group textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;
  outline:none;font-size:13px;background:var(--panel);color:var(--text);
  transition:border-color .15s,box-shadow .15s;
}
.form-group input:focus, .form-group textarea:focus{
  border-color:var(--primary);box-shadow:0 0 0 3px rgba(59,130,246,.1);
}
.btn-row{display:flex;gap:8px;}
.btn{
  padding:8px 12px;border-radius:8px;border:none;cursor:pointer;font-size:13px;
  font-weight:500;display:inline-flex;align-items:center;justify-content:center;
  gap:6px;flex:1;transition:.15s;white-space:nowrap;
}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:#2563eb;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-outline:hover{background:var(--hover);}
.btn-danger{background:var(--danger);color:#fff;}
.cloud-status{font-size:11.5px;color:var(--text2);text-align:center;word-break:break-all;}
.cloud-status.ok{color:#16a34a;}
.cloud-status.err{color:var(--danger);}
.cloud-status.warn{color:#d97706;}

/* ---------- 内容区 ---------- */
.content-area{
  flex:1;padding:16px 24px;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;min-height:0;scroll-behavior:smooth;
  /* 隐藏滚动条（保留滚动功能） */
  scrollbar-width: none;      /* Firefox */
  -ms-overflow-style: none;   /* IE / 旧 Edge */
}
/* Chrome / Safari / 新 Edge */
.content-area::-webkit-scrollbar{
  width: 0;
  height: 0;
  display: none;
}
.category-section{margin-bottom:26px;scroll-margin-top:16px;}
.content-title{
  font-size:15px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--border);
}
.title-left{display:flex;align-items:center;gap:8px;min-width:0;}
.title-left span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.title-left i{color:var(--primary);font-size:14px;}
.title-actions{display:flex;gap:6px;flex-shrink:0;}
.mini-btn{
  width:26px;height:26px;border-radius:6px;border:1px solid var(--border);
  background:var(--panel);color:var(--text2);cursor:pointer;font-size:12px;
  display:flex;align-items:center;justify-content:center;transition:.15s;
}
.mini-btn:hover{background:var(--primary-soft);color:var(--primary);border-color:var(--primary);}
.mini-btn.danger:hover{background:#fef2f2;color:var(--danger);border-color:var(--danger);}

/* ---------- 网格（靠左对齐） ---------- */
.links-grid{
  display:grid;
  grid-template-columns:repeat(var(--cols,5),var(--card-w));
  gap:var(--gap);
  justify-content:start;
  width:100%;
}

/* ---------- 卡片 ---------- */
.link-card{
  width:var(--card-w);height:var(--card-h);
  display:flex;align-items:center;gap:8px;padding:0 8px;
  border-radius:8px;border:none;background:transparent;
  cursor:pointer;color:var(--text);position:relative;
  transition:background-color .15s;
}
.link-card:hover{background:var(--hover);}
.link-card .icon-wrapper{
  width:28px;height:28px;flex-shrink:0;border-radius:5px;
  background:#eef2f7;display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.link-card .icon-wrapper img{width:28px;height:28px;object-fit:contain;}
.link-card .icon-wrapper i{font-size:14px;color:var(--text2);}
.link-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;overflow:hidden;}
.link-title{
  font-size:13px;font-weight:500;line-height:1.25;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.link-desc{
  font-size:11px;line-height:1.25;color:var(--text2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-del{
  position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;
  background:var(--danger);color:#fff;border:none;cursor:pointer;font-size:10px;
  display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s;
  box-shadow:0 2px 6px rgba(239,68,68,.4);
}
.link-card:hover .card-del{opacity:1;}
.card-del:hover{transform:scale(1.1);}

.edit-mode .link-card{background:#fff;box-shadow:0 0 0 1px var(--border) inset;}
.edit-mode .link-card:hover{box-shadow:0 0 0 1px var(--primary) inset;background:#fff;}
.edit-mode .link-card::before{
  content:"\f044";font-family:"Font Awesome 6 Free";font-weight:900;
  position:absolute;top:-5px;left:-5px;width:18px;height:18px;border-radius:50%;
  background:var(--primary);color:#fff;font-size:9px;
  display:flex;align-items:center;justify-content:center;opacity:0;transition:.15s;
}
.edit-mode .link-card:hover::before{opacity:1;}

/* ---------- 空状态 / 新增分类 ---------- */
.no-result{color:var(--text2);text-align:center;padding:50px 20px;font-size:14px;}
.add-cat-bar{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:14px;border:1.5px dashed var(--border);border-radius:10px;
  color:var(--text2);font-size:13.5px;cursor:pointer;transition:.15s;margin-top:6px;
}
.add-cat-bar:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);}
.empty-tip{grid-column:1/-1;font-size:12.5px;color:var(--text2);padding:6px 2px;}

/* ---------- 弹窗 ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;
  justify-content:center;align-items:center;z-index:2000;padding:16px;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--panel);padding:20px;border-radius:14px;width:100%;max-width:400px;
  box-shadow:0 20px 40px -8px rgba(15,23,42,.25);max-height:90vh;overflow-y:auto;
  animation:pop .18s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px);}to{opacity:1;transform:none;}}
.modal h3{font-size:16px;margin-bottom:16px;text-align:center;}
.modal .form-group{margin-bottom:12px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}

/* ---------- 引擎菜单 ---------- */
.engine-menu{
  position:fixed;display:none;background:var(--panel);border-radius:10px;
  box-shadow:var(--shadow);border:1px solid var(--border);z-index:2100;
  overflow:hidden;min-width:150px;padding:4px;
}
.engine-menu-item{
  padding:9px 13px;cursor:pointer;display:flex;align-items:center;gap:10px;
  font-size:13.5px;color:var(--text);border-radius:6px;white-space:nowrap;
}
.engine-menu-item:hover{background:var(--hover);}
.engine-menu-item i{width:16px;text-align:center;color:var(--text2);}
.engine-menu-item.active{color:var(--primary);background:var(--primary-soft);font-weight:600;}
.engine-menu-item.active i{color:var(--primary);}

/* ---------- Tooltip ---------- */
.tooltip{
  position:fixed;z-index:9999;background:#1e293b;color:#fff;font-size:11px;
  padding:4px 9px;border-radius:5px;max-width:320px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;pointer-events:none;opacity:0;
  transition:opacity .12s;display:none;box-shadow:0 4px 12px rgba(0,0,0,.25);
}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);z-index:9999;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;}
.toast{
  background:rgba(30,41,59,.94);color:#fff;font-size:13px;padding:9px 16px;border-radius:8px;
  box-shadow:0 8px 20px rgba(0,0,0,.2);animation:tin .2s ease;max-width:80vw;
}
.toast.err{background:rgba(220,38,38,.95);}
.toast.ok{background:rgba(22,163,74,.95);}
@keyframes tin{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ---------- 响应式 ---------- */
@media (max-width:768px){
  .header{padding:0 10px;height:56px;}
  .header-content{gap:6px;}
  .search-input{font-size:13.5px;height:36px;}
  .engine-switch{width:36px;height:36px;}
  .content-area{padding:12px 10px;}
  .settings-panel{width:calc(100vw - 20px);right:10px;left:10px;top:52px;}
  .content-title{font-size:14px;}
}
</style>
</head>
<body>

<div class="main-container">
  <header class="header">
    <div class="header-content">
      <div class="search-container">
        <div class="engine-switch" id="engineSwitch" onclick="toggleEngineMenu(event)" title="切换搜索引擎">
          <i class="fas fa-magnifying-glass"></i>
        </div>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索书签，回车使用当前引擎搜索" autocomplete="off" spellcheck="false">
        <span class="search-hint" id="searchHint"></span>
      </div>

      <div class="toolbar-actions">
        <button class="icon-btn" id="btnSettings" onclick="toggleSettings(event)" title="设置">
          <i class="fas fa-gear"></i>
        </button>
      </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-panel" id="settingsPanel">
      <div class="setting-row">
        <div class="setting-label"><i class="fas fa-network-wired"></i><span>网络模式</span></div>
        <div class="mode-switch" id="modeSwitch">
          <button data-mode="out" onclick="setMode('out')">外网</button>
          <button data-mode="in" onclick="setMode('in')">内网</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-label"><i class="fas fa-pen-to-square"></i><span>编辑模式</span></div>
        <label class="switch">
          <input type="checkbox" id="editSwitch" onchange="toggleEdit(this.checked)">
          <span class="slider"></span>
        </label>
      </div>

      <div class="panel-divider"></div>

      <div class="panel-title"><i class="fas fa-cloud"></i> 云端同步（WebDAV）</div>
      <div class="form-group">
        <label>JSON 文件完整地址</label>
        <input id="cloudUrl" placeholder="https://dav.example.com/nav/nav.json">
      </div>
      <div class="form-group">
        <label>用户名（可留空）</label>
        <input id="cloudUser" placeholder="WebDAV 用户名">
      </div>
      <div class="form-group">
        <label>密码 / 应用密码（可留空）</label>
        <input id="cloudPass" type="password" placeholder="WebDAV 密码">
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="cloudSyncSmart()"><i class="fas fa-arrows-rotate"></i> 同步</button>
        <button class="btn btn-outline" onclick="cloudUpload()"><i class="fas fa-cloud-arrow-up"></i> 上传</button>
        <button class="btn btn-outline" onclick="cloudDownload()"><i class="fas fa-cloud-arrow-down"></i> 下载</button>
      </div>
      <div class="cloud-status" id="cloudStatus">未配置</div>

      <div class="panel-divider"></div>

      <div class="panel-title"><i class="fas fa-database"></i> 本地备份</div>
      <div class="btn-row">
        <button class="btn btn-outline" onclick="exportData()"><i class="fas fa-file-export"></i> 导出</button>
        <button class="btn btn-outline" onclick="document.getElementById('importFile').click()"><i class="fas fa-file-import"></i> 导入</button>
      </div>
      <input type="file" id="importFile" accept="application/json,.json" style="display:none" onchange="importData(this)">
    </div>
  </header>

  <main class="content-area" id="contentArea"></main>
</div>

<div class="engine-menu" id="engineMenu"></div>
<div class="tooltip" id="tooltip"></div>
<div class="toast-wrap" id="toastWrap"></div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBox"></div>
</div>

<script>
/* =========================================================
 *  常量 / 默认数据
 * =======================================================*/
const LS = {
  DATA:   'nav_data_v3',
  CLOUD:  'nav_cloud_v3',
  MODE:   'nav_mode_v3',
  ENGINE: 'nav_engine_v3',
  EDIT:   'nav_edit_v3'
};

const DEFAULT_ENGINES = [
  { name: 'Bing',   url: 'https://www.bing.com/search?q=',   icon: 'fab fa-microsoft' },
  { name: 'Google', url: 'https://www.google.com/search?q=', icon: 'fab fa-google' },
  { name: '百度',   url: 'https://www.baidu.com/s?wd=',      icon: 'fas fa-paw' },
  { name: 'GitHub', url: 'https://github.com/search?q=',     icon: 'fab fa-github' }
];

function defaultData() {
  return {
    version: 1,
    searchEngines: JSON.parse(JSON.stringify(DEFAULT_ENGINES)),
    categories: [
      {
        id: uid(), name: 'NAS 服务', icon: 'fas fa-server',
        items: [
          { id: uid(), title: '群晖 DSM', desc: 'NAS 管理后台', icon: 'fas fa-hard-drive', url_out: '', url_in: 'http://192.168.1.10:5000' }
        ]
      },
      {
        id: uid(), name: '常用工具', icon: 'fas fa-tools',
        items: [
          { id: uid(), title: 'JSON 格式化', desc: '在线格式化校验', icon: 'fas fa-code', url_out: 'https://jsonformatter.org', url_in: '' }
        ]
      },
      {
        id: uid(), name: '资源站点', icon: 'fas fa-film',
        items: [
          { id: uid(), title: '哔哩哔哩', desc: '视频社区', icon: 'fab fa-bilibili', url_out: 'https://www.bilibili.com', url_in: '' }
        ]
      }
    ]
  };
}

/* =========================================================
 *  状态
 * =======================================================*/
const state = {
  data: null,
  mode: 'out',
  editMode: false,
  searchKey: '',
  engineIndex: 0
};
let cloudCfg = null;
let pushTimer = null;

/* =========================================================
 *  工具函数
 * =======================================================*/
function uid() { return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function b64encode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function val(id) { const el = document.getElementById(id); return el ? el.value : ''; }

function hostOf(url) {
  try { return new URL(url).hostname; } catch (e) { return ''; }
}

function faIcon(icon, fallback) {
  fallback = fallback || 'fas fa-folder';
  if (!icon) return fallback;
  const s = String(icon).trim();
  if (s.includes(' ')) return s;
  if (s.startsWith('fa-')) return 'fas ' + s;
  return 'fas ' + s;
}

function isImgIcon(s) {
  return /^(https?:)?\/\//i.test(s) || /^data:image/i.test(s) || s.startsWith('/') || /\.(png|jpe?g|svg|gif|webp|ico)(\?.*)?$/i.test(s);
}

function iconHtml(icon, fallback) {
  fallback = fallback || 'fas fa-link';
  const s = String(icon || '').trim();
  if (!s) return `<i class="${fallback}"></i>`;
  if (isImgIcon(s)) return `<img src="${esc(s)}" alt="" loading="lazy" onerror="imgFallback(this,'${fallback}')">`;
  return `<i class="${esc(faIcon(s, fallback))}"></i>`;
}

function imgFallback(img, cls) {
  const i = document.createElement('i');
  i.className = cls || 'fas fa-link';
  if (img.parentNode) img.parentNode.replaceChild(i, img);
}

function toast(msg, type) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.transition = 'opacity .25s';
    el.style.opacity = '0';
    setTimeout(() => el.remove(), 260);
  }, 2200);
}

function setCloudStatus(text, type) {
  const el = document.getElementById('cloudStatus');
  if (!el) return;
  el.textContent = text;
  el.className = 'cloud-status' + (type ? ' ' + type : '');
}

/* =========================================================
 *  数据规范化
 * =======================================================*/
function normalize(d) {
  d = d || {};
  const out = {
    version: 1,
    searchEngines: (Array.isArray(d.searchEngines) && d.searchEngines.length)
      ? d.searchEngines.filter(e => e && e.url).map(e => ({
          name: e.name || '搜索引擎',
          url: e.url,
          icon: e.icon || 'fas fa-magnifying-glass'
        }))
      : JSON.parse(JSON.stringify(DEFAULT_ENGINES)),
    categories: []
  };

  (Array.isArray(d.categories) ? d.categories : []).forEach(c => {
    if (!c) return;
    out.categories.push({
      id: c.id || uid(),
      name: c.name || '未命名分类',
      icon: c.icon || 'fas fa-folder',
      items: (Array.isArray(c.items) ? c.items : []).filter(Boolean).map(i => ({
        id: i.id || uid(),
        title: i.title || '未命名',
        desc: i.desc || '',
        icon: i.icon || '',
        url: i.url || '',
        url_in: i.url_in || '',
        url_out: i.url_out || ''
      }))
    });
  });

  return out;
}

/* =========================================================
 *  本地存储
 * =======================================================*/
function saveLocal() {
  try { localStorage.setItem(LS.DATA, JSON.stringify(state.data)); } catch (e) { console.warn(e); }
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS.DATA);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

/* =========================================================
 *  云端存储（WebDAV）
 * =======================================================*/
function cloudHeaders(extra) {
  const h = Object.assign({}, extra || {});
  if (cloudCfg && (cloudCfg.user || cloudCfg.pass)) {
    h['Authorization'] = 'Basic ' + b64encode((cloudCfg.user || '') + ':' + (cloudCfg.pass || ''));
  }
  return h;
}

async function cloudGet() {
  if (!cloudCfg || !cloudCfg.url) throw new Error('未配置云端地址');
  const res = await fetch(cloudCfg.url, {
    method: 'GET',
    headers: cloudHeaders({ 'Accept': 'application/json,text/plain,*/*' }),
    cache: 'no-store'
  });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  if (!text.trim()) throw new Error('云端文件为空');
  return JSON.parse(text);
}

async function cloudPut(data) {
  if (!cloudCfg || !cloudCfg.url) throw new Error('未配置云端地址');
  const res = await fetch(cloudCfg.url, {
    method: 'PUT',
    headers: cloudHeaders({ 'Content-Type': 'application/json; charset=utf-8' }),
    body: JSON.stringify(data, null, 2)
  });
  if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (res.statusText || ''));
  return true;
}

function readCloudForm() {
  const url = val('cloudUrl').trim();
  if (!url) { toast('请填写云端 JSON 文件地址', 'err'); return null; }
  cloudCfg = { url, user: val('cloudUser').trim(), pass: val('cloudPass') };
  try { localStorage.setItem(LS.CLOUD, JSON.stringify(cloudCfg)); } catch (e) {}
  return cloudCfg;
}

/** 把已保存的云端配置回填到表单 */
function fillCloudForm() {
  if (!cloudCfg) return;
  const u = document.getElementById('cloudUrl');
  const n = document.getElementById('cloudUser');
  const p = document.getElementById('cloudPass');
  if (u) u.value = cloudCfg.url || '';
  if (n) n.value = cloudCfg.user || '';
  if (p) p.value = cloudCfg.pass || '';
}

/** 输入变化即时保存到本地，避免每次访问重新填写 */
function persistCloudForm() {
  const url = val('cloudUrl').trim();
  if (!url) return;
  cloudCfg = { url, user: val('cloudUser').trim(), pass: val('cloudPass') };
  try { localStorage.setItem(LS.CLOUD, JSON.stringify(cloudCfg)); } catch (e) {}
  setCloudStatus('配置已保存到本地', 'ok');
}

async function cloudSyncSmart() {
  if (!readCloudForm()) return;
  setCloudStatus('正在同步...', 'warn');
  let remote = null;
  try { remote = await cloudGet(); } catch (e) { remote = null; }

  if (remote && Array.isArray(remote.categories)) {
    const useCloud = confirm(
      '云端已有数据（' + remote.categories.length + ' 个分类）\n\n' +
      '点击【确定】= 用云端数据覆盖本地\n' +
      '点击【取消】= 用本地数据覆盖云端'
    );
    if (useCloud) {
      state.data = normalize(remote);
      saveLocal();
      render();
      setCloudStatus('已从云端同步到本地', 'ok');
      toast('已从云端同步', 'ok');
    } else {
      try {
        await cloudPut(state.data);
        setCloudStatus('已上传本地数据到云端', 'ok');
        toast('已上传到云端', 'ok');
      } catch (e) { setCloudStatus('上传失败：' + e.message, 'err'); toast('上传失败', 'err'); }
    }
  } else {
    try {
      await cloudPut(state.data);
      setCloudStatus('云端无数据，已上传本地配置', 'ok');
      toast('已创建云端配置', 'ok');
    } catch (e) { setCloudStatus('上传失败：' + e.message, 'err'); toast('上传失败：' + e.message, 'err'); }
  }
}

async function cloudUpload() {
  if (!readCloudForm()) return;
  setCloudStatus('正在上传...', 'warn');
  try {
    await cloudPut(state.data);
    setCloudStatus('上传成功 ' + new Date().toLocaleTimeString(), 'ok');
    toast('上传成功', 'ok');
  } catch (e) {
    setCloudStatus('上传失败：' + e.message, 'err');
    toast('上传失败：' + e.message, 'err');
  }
}

async function cloudDownload() {
  if (!readCloudForm()) return;
  if (!confirm('将用云端数据覆盖本地，确定继续？')) return;
  setCloudStatus('正在下载...', 'warn');
  try {
    const remote = await cloudGet();
    state.data = normalize(remote);
    saveLocal();
    render();
    setCloudStatus('下载成功 ' + new Date().toLocaleTimeString(), 'ok');
    toast('已从云端下载', 'ok');
  } catch (e) {
    setCloudStatus('下载失败：' + e.message, 'err');
    toast('下载失败：' + e.message, 'err');
  }
}

function schedulePush() {
  if (!cloudCfg || !cloudCfg.url) return;
  clearTimeout(pushTimer);
  setCloudStatus('数据已修改，等待自动同步...', 'warn');
  pushTimer = setTimeout(async () => {
    try {
      await cloudPut(state.data);
      setCloudStatus('已自动同步 ' + new Date().toLocaleTimeString(), 'ok');
    } catch (e) {
      setCloudStatus('自动同步失败：' + e.message, 'err');
    }
  }, 2000);
}

/* =========================================================
 *  启动
 * =======================================================*/
async function boot() {
  state.mode = localStorage.getItem(LS.MODE) === 'in' ? 'in' : 'out';
  state.editMode = localStorage.getItem(LS.EDIT) === '1';
  state.engineIndex = parseInt(localStorage.getItem(LS.ENGINE) || '0', 10) || 0;

  try { cloudCfg = JSON.parse(localStorage.getItem(LS.CLOUD) || 'null'); } catch (e) { cloudCfg = null; }

  const local = loadLocal();

  if (local) {
    state.data = normalize(local);
  } else if (cloudCfg && cloudCfg.url) {
    setCloudStatus('正在从云端加载...', 'warn');
    try {
      const remote = await cloudGet();
      state.data = normalize(remote);
      saveLocal();
      setCloudStatus('已从云端加载', 'ok');
    } catch (e) {
      state.data = defaultData();
      saveLocal();
      setCloudStatus('云端加载失败，使用默认数据', 'err');
    }
  } else {
    state.data = defaultData();
    saveLocal();
  }

  bindEvents();
  buildEngineMenu();
  render();

  // 配置回填：有配置就直接显示，不再要求重新填写
  if (cloudCfg && cloudCfg.url) {
    fillCloudForm();
    setCloudStatus('已保存配置：' + cloudCfg.url, 'ok');
  } else {
    // 首次访问才引导配置
    setTimeout(() => {
      openSettings();
      setCloudStatus('首次使用请配置 WebDAV 地址以启用云端同步', 'warn');
    }, 600);
  }
}

/* =========================================================
 *  渲染
 * =======================================================*/
function render() {
  renderContent();
  updateGridLayout();

  const editSwitch = document.getElementById('editSwitch');
  if (editSwitch) editSwitch.checked = state.editMode;
  document.body.classList.toggle('edit-mode', state.editMode);

  const modeSwitch = document.getElementById('modeSwitch');
  if (modeSwitch) {
    modeSwitch.querySelectorAll('button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === state.mode);
    });
  }
  updateEngineHint();
}

function resolveUrl(item) {
  const order = state.mode === 'in'
    ? [item.url_in, item.url_out, item.url]
    : [item.url_out, item.url_in, item.url];
  for (const u of order) {
    if (u && String(u).trim()) return String(u).trim();
  }
  return '';
}

function cardHtml(item, cat) {
  const url = resolveUrl(item);
  const desc = item.desc || hostOf(url) || '—';
  const icon = iconHtml(item.icon, 'fas fa-link');
  const inner = `
    <div class="icon-wrapper">${icon}</div>
    <div class="link-info">
      <div class="link-title">${esc(item.title)}</div>
      <div class="link-desc">${esc(desc)}</div>
    </div>`;

  if (state.editMode) {
    return `<div class="link-card" data-url="${esc(url)}"
                 onclick="openLinkEditor('${cat.id}','${item.id}')">
              ${inner}
              <button class="card-del" title="删除站点"
                onclick="event.stopPropagation();deleteLink('${cat.id}','${item.id}')">
                <i class="fas fa-xmark"></i>
              </button>
            </div>`;
  }
  return `<a class="link-card" href="${esc(url || 'javascript:;')}" target="_blank" rel="noopener"
             data-url="${esc(url)}" title="${esc(item.title)}">${inner}</a>`;
}

function renderCategory(cat) {
  const items = (cat.items || []).map(it => cardHtml(it, cat)).join('');
  const actions = state.editMode ? `
    <span class="title-actions">
      <button class="mini-btn" title="添加站点" onclick="openLinkEditor('${cat.id}')"><i class="fas fa-plus"></i></button>
      <button class="mini-btn" title="编辑分类" onclick="openCategoryEditor('${cat.id}')"><i class="fas fa-pen"></i></button>
      <button class="mini-btn danger" title="删除分类" onclick="deleteCategory('${cat.id}')"><i class="fas fa-trash"></i></button>
    </span>` : '';

  const gridContent = items || (state.editMode
    ? `<div class="empty-tip"><i class="fas fa-circle-info"></i> 暂无站点，点击右上角 + 添加</div>`
    : '');

  return `<section class="category-section" id="cat-${cat.id}">
            <div class="content-title">
              <span class="title-left">
                <i class="${esc(faIcon(cat.icon, 'fas fa-folder'))}"></i>
                <span>${esc(cat.name)}</span>
              </span>
              ${actions}
            </div>
            <div class="links-grid">${gridContent}</div>
          </section>`;
}

function renderContent() {
  const container = document.getElementById('contentArea');
  if (!state.data) { container.innerHTML = '<div class="no-result">正在加载...</div>'; return; }

  if (state.searchKey) {
    const k = state.searchKey.toLowerCase();
    const results = [];
    state.data.categories.forEach(cat => {
      (cat.items || []).forEach(it => {
        const hay = [it.title, it.desc, it.url, it.url_in, it.url_out].join(' ').toLowerCase();
        if (hay.includes(k)) results.push({ item: it, cat });
      });
    });

    if (!results.length) {
      container.innerHTML = `<div class="no-result">未找到与 “${esc(state.searchKey)}” 相关的书签</div>`;
      updateGridLayout();
      return;
    }
    container.innerHTML = `
      <section class="category-section">
        <div class="content-title">
          <span class="title-left"><i class="fas fa-magnifying-glass"></i>
            <span>搜索结果 · ${esc(state.searchKey)}（${results.length}）</span></span>
        </div>
        <div class="links-grid">${results.map(r => cardHtml(r.item, r.cat)).join('')}</div>
      </section>`;
    updateGridLayout();
    return;
  }

  if (!state.data.categories.length) {
    container.innerHTML = `<div class="no-result">
        暂无任何分类${state.editMode ? '，点击下方按钮创建' : '，请开启编辑模式添加'}
      </div>` + (state.editMode
        ? `<div class="add-cat-bar" onclick="openCategoryEditor()"><i class="fas fa-plus"></i> 新增分类</div>`
        : '');
    updateGridLayout();
    return;
  }

  let html = state.data.categories.map(renderCategory).join('');
  if (state.editMode) {
    html += `<div class="add-cat-bar" onclick="openCategoryEditor()"><i class="fas fa-plus"></i> 新增分类</div>`;
  }
  container.innerHTML = html;
  updateGridLayout();
}

/* 计算每行列数：最少 2，最多 10（靠左排列） */
function updateGridLayout() {
  const area = document.getElementById('contentArea');
  if (!area) return;
  const cs = getComputedStyle(area);
  const avail = area.clientWidth - parseFloat(cs.paddingLeft || 0) - parseFloat(cs.paddingRight || 0);
  const cardW = 150, gap = 10;
  let cols = Math.floor((avail + gap) / (cardW + gap));
  cols = Math.max(2, Math.min(10, cols || 2));
  area.style.setProperty('--cols', cols);
}

/* =========================================================
 *  搜索引擎
 * =======================================================*/
function getEngines() {
  return (state.data && state.data.searchEngines && state.data.searchEngines.length)
    ? state.data.searchEngines
    : DEFAULT_ENGINES;
}

function buildEngineMenu() {
  const menu = document.getElementById('engineMenu');
  const engines = getEngines();
  if (state.engineIndex >= engines.length) state.engineIndex = 0;

  menu.innerHTML = engines.map((e, i) => `
    <div class="engine-menu-item ${i === state.engineIndex ? 'active' : ''}" onclick="selectEngine(${i})">
      <i class="${esc(e.icon || 'fas fa-magnifying-glass')}"></i> ${esc(e.name)}
    </div>`).join('');

  updateEngineBtn();
}

function updateEngineBtn() {
  const engines = getEngines();
  const engine = engines[state.engineIndex] || engines[0];
  const btn = document.getElementById('engineSwitch');
  if (btn && engine) btn.innerHTML = `<i class="${esc(engine.icon || 'fas fa-magnifying-glass')}"></i>`;
  updateEngineHint();
}

function updateEngineHint() {
  const engines = getEngines();
  const engine = engines[state.engineIndex] || engines[0];
  const hint = document.getElementById('searchHint');
  if (!hint || !engine) return;
  if (window.innerWidth > 768) {
    hint.style.display = 'block';
    hint.textContent = 'Enter: ' + engine.name;
  } else {
    hint.style.display = 'none';
  }
}

function toggleEngineMenu(ev) {
  ev.stopPropagation();
  const menu = document.getElementById('engineMenu');
  if (menu.style.display === 'block') { menu.style.display = 'none'; return; }
  const rect = document.getElementById('engineSwitch').getBoundingClientRect();
  menu.style.display = 'block';
  const mw = menu.offsetWidth;
  let left = rect.left;
  if (left + mw > window.innerWidth - 8) left = window.innerWidth - mw - 8;
  menu.style.left = Math.max(8, left) + 'px';
  menu.style.top = (rect.bottom + 6) + 'px';
}

function selectEngine(i) {
  state.engineIndex = i;
  localStorage.setItem(LS.ENGINE, String(i));
  document.getElementById('engineMenu').style.display = 'none';
  buildEngineMenu();
  document.getElementById('searchInput').focus();
}

/* =========================================================
 *  设置面板 / 模式
 * =======================================================*/
function toggleSettings(ev) {
  if (ev) ev.stopPropagation();
  const panel = document.getElementById('settingsPanel');
  panel.classList.toggle('open');
  document.getElementById('btnSettings').classList.toggle('active', panel.classList.contains('open'));
  if (panel.classList.contains('open')) fillCloudForm();
}

function openSettings() {
  const panel = document.getElementById('settingsPanel');
  panel.classList.add('open');
  document.getElementById('btnSettings').classList.add('active');
  fillCloudForm();
}

function setMode(mode) {
  state.mode = mode === 'in' ? 'in' : 'out';
  localStorage.setItem(LS.MODE, state.mode);
  render();
  toast(state.mode === 'in' ? '已切换到内网地址' : '已切换到外网地址');
}

function toggleEdit(on) {
  state.editMode = !!on;
  localStorage.setItem(LS.EDIT, state.editMode ? '1' : '0');
  renderContent();
  document.body.classList.toggle('edit-mode', state.editMode);
  if (state.editMode) toast('编辑模式已开启，点击卡片可编辑');
}

/* =========================================================
 *  弹窗
 * =======================================================*/
function openModal(html) {
  document.getElementById('modalBox').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
}

function findCat(catId) {
  return (state.data.categories || []).find(c => c.id === catId);
}

/* ---- 站点编辑 ---- */
function openLinkEditor(catId, itemId) {
  const cat = findCat(catId);
  if (!cat) return;
  const item = itemId ? (cat.items || []).find(i => i.id === itemId) : null;

  openModal(`
    <h3>${item ? '编辑站点' : '添加站点'} · ${esc(cat.name)}</h3>
    <div class="form-group">
      <label>名称 *</label>
      <input id="f_title" value="${esc(item ? item.title : '')}" placeholder="例如：群晖 DSM">
    </div>
    <div class="form-group">
      <label>简介</label>
      <input id="f_desc" value="${esc(item ? item.desc : '')}" placeholder="例如：NAS 管理后台（留空自动显示域名）">
    </div>
    <div class="form-group">
      <label>图标（图片 URL 或 FontAwesome 类名）</label>
      <input id="f_icon" value="${esc(item ? item.icon : '')}" placeholder="fas fa-server 或 https://.../logo.png">
    </div>
    <div class="form-group">
      <label>外网地址</label>
      <input id="f_url_out" value="${esc(item ? (item.url_out || item.url || '') : '')}" placeholder="https://example.com">
    </div>
    <div class="form-group">
      <label>内网地址</label>
      <input id="f_url_in" value="${esc(item ? item.url_in : '')}" placeholder="http://192.168.1.10:5000">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveLink('${catId}','${itemId || ''}')">保存</button>
    </div>
  `);

  setTimeout(() => { const el = document.getElementById('f_title'); if (el) el.focus(); }, 60);
}

function saveLink(catId, itemId) {
  const title = val('f_title').trim();
  if (!title) { toast('请填写名称', 'err'); return; }

  const data = {
    title,
    desc: val('f_desc').trim(),
    icon: val('f_icon').trim(),
    url_out: val('f_url_out').trim(),
    url_in: val('f_url_in').trim(),
    url: ''
  };

  if (!data.url_out && !data.url_in) { toast('请至少填写一个地址', 'err'); return; }

  const cat = findCat(catId);
  if (!cat) return;

  if (itemId) {
    const item = (cat.items || []).find(i => i.id === itemId);
    if (item) Object.assign(item, data);
  } else {
    cat.items = cat.items || [];
    cat.items.push(Object.assign({ id: uid() }, data));
  }

  closeModal();
  commit();
  toast('已保存', 'ok');
}

function deleteLink(catId, itemId) {
  const cat = findCat(catId);
  if (!cat) return;
  const item = (cat.items || []).find(i => i.id === itemId);
  if (!item) return;
  if (!confirm(`确定删除站点「${item.title}」？`)) return;
  cat.items = cat.items.filter(i => i.id !== itemId);
  commit();
  toast('已删除', 'ok');
}

/* ---- 分类编辑 ---- */
function openCategoryEditor(catId) {
  const cat = catId ? findCat(catId) : null;

  openModal(`
    <h3>${cat ? '编辑分类' : '新增分类'}</h3>
    <div class="form-group">
      <label>分类名称 *</label>
      <input id="c_name" value="${esc(cat ? cat.name : '')}" placeholder="例如：常用工具">
    </div>
    <div class="form-group">
      <label>分类图标（FontAwesome 类名）</label>
      <input id="c_icon" value="${esc(cat ? cat.icon : 'fas fa-folder')}" placeholder="fas fa-folder">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveCategory('${catId || ''}')">保存</button>
    </div>
  `);

  setTimeout(() => { const el = document.getElementById('c_name'); if (el) el.focus(); }, 60);
}

function saveCategory(catId) {
  const name = val('c_name').trim();
  if (!name) { toast('请填写分类名称', 'err'); return; }
  const icon = val('c_icon').trim() || 'fas fa-folder';

  if (catId) {
    const cat = findCat(catId);
    if (cat) { cat.name = name; cat.icon = icon; }
  } else {
    state.data.categories.push({ id: uid(), name, icon, items: [] });
  }

  closeModal();
  commit();
  toast('已保存', 'ok');
}

function deleteCategory(catId) {
  const cat = findCat(catId);
  if (!cat) return;
  if (!confirm(`确定删除分类「${cat.name}」及其下所有站点？`)) return;
  state.data.categories = state.data.categories.filter(c => c.id !== catId);
  commit();
  toast('已删除分类', 'ok');
}

/* =========================================================
 *  提交变更
 * =======================================================*/
function commit() {
  saveLocal();
  render();
  schedulePush();
}

/* =========================================================
 *  导入 / 导出
 * =======================================================*/
function exportData() {
  const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nav-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('已导出', 'ok');
}

function importData(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      if (!data || !Array.isArray(data.categories)) throw new Error('格式不正确');
      if (!confirm('导入将覆盖当前所有数据，确定继续？')) return;
      state.data = normalize(data);
      commit();
      toast('导入成功', 'ok');
    } catch (e) {
      toast('导入失败：' + e.message, 'err');
    } finally {
      input.value = '';
    }
  };
  reader.readAsText(file);
}

/* =========================================================
 *  Tooltip
 * =======================================================*/
const tipEl = document.getElementById('tooltip');
let tipTimer = null;

function showTip(card) {
  if (window.matchMedia('(hover: none)').matches) return;
  const url = card.dataset.url;
  if (!url || url === 'javascript:;') return;

  tipEl.textContent = url;
  tipEl.style.display = 'block';
  tipEl.style.opacity = '0';

  const r = card.getBoundingClientRect();
  const tr = tipEl.getBoundingClientRect();

  let top = r.bottom + 6;
  if (top + tr.height > window.innerHeight - 6) top = r.top - tr.height - 6;
  let left = r.left + r.width / 2 - tr.width / 2;
  left = Math.max(6, Math.min(left, window.innerWidth - tr.width - 6));

  tipEl.style.top = top + 'px';
  tipEl.style.left = left + 'px';
  tipEl.style.opacity = '1';
}

function hideTip() {
  tipEl.style.opacity = '0';
  tipEl.style.display = 'none';
}

/* =========================================================
 *  事件绑定
 * =======================================================*/
function bindEvents() {
  const searchInput = document.getElementById('searchInput');
  let searchTimer = null;

  searchInput.addEventListener('input', e => {
    const v = e.target.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.searchKey = v.trim();
      renderContent();
    }, 120);
  });

  searchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const key = e.target.value.trim();
      if (!key) return;
      const engines = getEngines();
      const engine = engines[state.engineIndex] || engines[0];
      if (engine && engine.url) {
        window.open(engine.url + encodeURIComponent(key), '_blank');
      }
    }
  });

  // 云端配置输入变化自动保存（避免每次访问重填）
  ['cloudUrl', 'cloudUser', 'cloudPass'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('change', persistCloudForm);
  });

  document.addEventListener('click', e => {
    const panel = document.getElementById('settingsPanel');
    if (panel.classList.contains('open')
        && !e.target.closest('#settingsPanel')
        && !e.target.closest('#btnSettings')) {
      panel.classList.remove('open');
      document.getElementById('btnSettings').classList.remove('active');
    }
    const menu = document.getElementById('engineMenu');
    if (menu.style.display === 'block'
        && !e.target.closest('#engineMenu')
        && !e.target.closest('#engineSwitch')) {
      menu.style.display = 'none';
    }
  });

  let rzTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(() => {
      updateGridLayout();
      updateEngineHint();
    }, 100);
  });

  if (window.ResizeObserver) {
    const area = document.getElementById('contentArea');
    new ResizeObserver(() => updateGridLayout()).observe(area);
  }

  document.addEventListener('mouseover', e => {
    const card = e.target.closest && e.target.closest('.link-card');
    if (!card) return;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => showTip(card), 220);
  });

  document.addEventListener('mouseout', e => {
    const card = e.target.closest && e.target.closest('.link-card');
    if (!card) return;
    clearTimeout(tipTimer);
    hideTip();
  });

  document.addEventListener('scroll', hideTip, true);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closeModal();
      document.getElementById('settingsPanel').classList.remove('open');
      document.getElementById('engineMenu').style.display = 'none';
    }
  });
}

/* =========================================================
 *  启动
 * =======================================================*/
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
